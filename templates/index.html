<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deepfake Defence — {{ mode | capitalize }}</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">🛡️ Deepfake Defence</div>
    <p class="auth-sub">Image · Video · Audio · Face Morph · Voice Morph</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="auth-tabs">
      <a href="/login"  class="auth-tab {% if mode == 'login'  %}active{% endif %}">Login</a>
      <a href="/signup" class="auth-tab {% if mode == 'signup' %}active{% endif %}">Sign Up</a>
    </div>

    <form method="POST">
      {% if mode == 'signup' %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. mushkan" required autocomplete="username"/>
      </div>
      {% endif %}

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@email.com" required autocomplete="email"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
      </div>

      <button type="submit" class="btn-submit">
        {{ "Create Account" if mode == "signup" else "Login" }}
      </button>
    </form>

  </div>
</div>

</body>
</html>
